plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zhixingos'
version = '1.0.1'

android {
  namespace 'com.zhixingos.vision'
  defaultConfig {
    versionCode 2
    versionName '1.0.1'
  }
}

// Strict-local Android builds intentionally ship no third-party vision SDK.
// Photo auto-fitting stays disabled until a dependency can be proven offline
// and telemetry-free. The TypeScript fitting math remains available for Web.
