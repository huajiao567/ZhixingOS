plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zhixingos'
version = '1.0.0'

android {
  namespace 'com.zhixingos.vision'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled models: first use works offline and no image is sent to Google Play services.
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}
