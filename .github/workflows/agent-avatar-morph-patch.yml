name: Temporary avatar morph bridge patch

on:
  push:
    branches:
      - ai/avatar-model-morph-bridge-v1
    paths:
      - ".github/workflows/agent-avatar-morph-patch.yml"
      - "scripts/apply-avatar-model-morph-bridge.py"

permissions:
  contents: write

concurrency:
  group: temporary-avatar-morph-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ai/avatar-model-morph-bridge-v1
          fetch-depth: 0

      - name: Apply strict one-shot patch
        run: python scripts/apply-avatar-model-morph-bridge.py

      - name: Commit renderer and E2E bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mirror3d/avatar/v2/VRMAvatarView.tsx e2e/avatar-research-candidate.spec.ts
          git diff --cached --check
          git commit -m "feat: apply structural identity morphs in avatar renderer"
          git push origin HEAD:ai/avatar-model-morph-bridge-v1
