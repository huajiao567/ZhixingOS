name: Avatar skinning fidelity audit

on:
  push:
    branches:
      - "ai/avatar-*"
    paths:
      - ".github/workflows/avatar-skinning-fidelity.yml"
      - "scripts/audit-makehuman-runtime-skinning.py"
      - "scripts/audit-makehuman-worst-vertex-groups.py"
      - "scripts/audit-makehuman-body-export.py"
      - "scripts/build-makehuman-vrm-candidate.py"
      - "scripts/build-makehuman-body-runtime-candidate.py"
      - "src/mirror3d/avatar/v2/VRMAvatarView.tsx"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/avatar-skinning-fidelity.yml"
      - "scripts/audit-makehuman-runtime-skinning.py"
      - "scripts/audit-makehuman-worst-vertex-groups.py"
      - "scripts/audit-makehuman-body-export.py"
      - "scripts/build-makehuman-vrm-candidate.py"
      - "scripts/build-makehuman-body-runtime-candidate.py"
      - "src/mirror3d/avatar/v2/VRMAvatarView.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-skinning-fidelity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Pinned MakeHuman runtime skinning audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Self-test audit math
        run: python scripts/audit-makehuman-runtime-skinning.py --self-test

      - name: Audit pinned source weights
        run: python scripts/audit-makehuman-runtime-skinning.py --output artifacts/makehuman-skinning-audit/report.json

      - name: Trace low-retention vertices to pinned OBJ groups
        run: python scripts/audit-makehuman-worst-vertex-groups.py --threshold 0.85 --output artifacts/makehuman-skinning-audit/worst-vertex-groups.json

      - name: Quantify body-only export gate and morph coverage
        run: python scripts/audit-makehuman-body-export.py --output artifacts/makehuman-skinning-audit/body-export.json

      - name: Self-test clean-body builder
        run: python scripts/build-makehuman-body-runtime-candidate.py --self-test

      - name: Build clean-body runtime-equivalent research candidate
        run: python scripts/build-makehuman-body-runtime-candidate.py --output-dir artifacts/makehuman-clean-body-candidate

      - name: Enforce audit and candidate truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/makehuman-skinning-audit/report.json').read_text())
          groups = json.loads(Path('artifacts/makehuman-skinning-audit/worst-vertex-groups.json').read_text())
          body = json.loads(Path('artifacts/makehuman-skinning-audit/body-export.json').read_text())
          candidate = json.loads(Path('artifacts/makehuman-clean-body-candidate/clean-body-report.json').read_text())
          expected_commit = 'a8bc2d54ff0ac92e78ff71431b1023eda42bf482'
          for name, item in [('audit', report), ('group trace', groups), ('body export', body), ('clean candidate', candidate)]:
              if item.get('upstream', {}).get('commit') != expected_commit:
                  raise SystemExit(f'{name} did not use the pinned MakeHuman commit')
          if report.get('upstream', {}).get('weightsLicense') != 'CC0' or body.get('upstream', {}).get('weightsLicense') != 'CC0':
              raise SystemExit('pinned weights lost the expected CC0 declaration')
          baseline = report.get('baseline') or {}
          collapsed = report.get('collapsedToHumanoidAncestors') or {}
          if baseline.get('minimumRetainedRawWeightRatio', 1) >= 0.85:
              raise SystemExit('baseline unexpectedly no longer reproduces the known top-4 retention blocker')
          if groups.get('failingVertexCount') != collapsed.get('verticesBelow085'):
              raise SystemExit('OBJ group trace and retained-weight audit disagree on the failing vertex count')
          if groups.get('failingGroupHistogram') != {'helper-hair': 16}:
              raise SystemExit(f'low-retention vertex ownership changed: {groups.get("failingGroupHistogram")}')
          gate = body.get('provisionalGate') or {}
          if gate.get('collapsedBodyPass') is not True or gate.get('allStructuralMorphsStillAffectBody') is not True:
              raise SystemExit(f'body-only audit gate failed: {gate}')
          geometry = candidate.get('geometry') or {}
          skin = candidate.get('skin') or {}
          if geometry.get('exportedObjGroup') != 'body' or geometry.get('vertexCount') != 13380 or geometry.get('triangleCount') != 26756:
              raise SystemExit(f'clean candidate geometry differs from audited body set: {geometry}')
          if skin.get('provisionalMinimumRetainedWeightGatePass') is not True or skin.get('minimumRetainedRawWeightRatio', 0) < 0.85:
              raise SystemExit(f'clean candidate did not preserve the 0.85 skinning gate: {skin}')
          if candidate.get('productionReplacementPass') is not False:
              raise SystemExit('research candidate must never silently become production replacement')
          if sorted(row.get('name') for row in candidate.get('morphs') or []) != ['eye_size', 'face_jaw_width', 'mouth_width', 'nose_width']:
              raise SystemExit(f'clean candidate structural morph set changed: {candidate.get("morphs")}')
          print('[avatar-skinning-candidate-boundary]', json.dumps({
              'baselineMinimum': baseline.get('minimumRetainedRawWeightRatio'),
              'fullCollapsedMinimum': collapsed.get('minimumRetainedRawWeightRatio'),
              'cleanGeometry': geometry,
              'cleanSkin': skin,
              'candidate': candidate.get('candidate'),
              'productionReplacementPass': candidate.get('productionReplacementPass'),
          }, ensure_ascii=False))
          PY

      - name: Upload skinning audit and clean candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatar-skinning-fidelity-audit
          path: |
            artifacts/makehuman-skinning-audit/
            artifacts/makehuman-clean-body-candidate/
          if-no-files-found: error
          retention-days: 7
