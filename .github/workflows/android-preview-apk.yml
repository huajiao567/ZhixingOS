name: Android preview APK

on:
  push:
    branches:
      - master
      - ai/android-apk-preview-v1
      - ai/android-native-smoke-v1
    paths:
      - ".github/workflows/android-preview-apk.yml"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "index.ts"
      - "App.tsx"
      - "assets/**"
      - "public/**"
      - "src/**"
      - "modules/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/android-preview-apk.yml"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "index.ts"
      - "App.tsx"
      - "assets/**"
      - "public/**"
      - "src/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhixingos-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview-apk:
    name: Android release-preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ] && [ -n "${ANDROID_HOME:-}" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager_bin" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            sdkmanager_bin="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager was not found. ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" >&2
            exit 1
          fi
          echo "SDKMANAGER=$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Generate native Android project
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          test -f android/gradlew
          test -f android/app/build.gradle
          manifest=android/app/src/main/AndroidManifest.xml
          grep -R "com.zhixingos.satori" android/app/build.gradle "$manifest" >/dev/null
          grep -F 'android:allowBackup="false"' "$manifest"
          grep -F 'android:usesCleartextTraffic="false"' "$manifest"
          chmod +x android/gradlew

      - name: Build standalone release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Audit strict-local Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-preview
          cd android
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > ../artifacts/android-preview/release-runtime-dependencies.txt
          cd ..
          if grep -Eqi 'com\.google\.mlkit|com\.google\.firebase|firebase-installations|firebase-config' artifacts/android-preview/release-runtime-dependencies.txt; then
            echo "Strict-local APK contains a forbidden ML Kit/Firebase runtime dependency." >&2
            grep -Ei 'com\.google\.mlkit|com\.google\.firebase|firebase-installations|firebase-config' artifacts/android-preview/release-runtime-dependencies.txt || true
            exit 1
          fi
          if grep -R -En 'com\.google\.mlkit|com\.google\.firebase' modules/zhixing-vision/android src/mirror3d/avatar/photoFitting.ts; then
            echo "Strict-local source still references a forbidden native telemetry SDK." >&2
            exit 1
          fi
          echo "forbiddenNativeVisionDependencies=none" > artifacts/android-preview/privacy-audit.txt
          echo "automaticNativePhotoFitting=disabled" >> artifacts/android-preview/privacy-audit.txt

      - name: Verify and package APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          apk="${candidates[0]}"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"

          if ! "$apksigner" verify --verbose "$apk" >/dev/null 2>&1; then
            keytool -genkeypair -noprompt \
              -keystore /tmp/zhixingos-preview.keystore \
              -storepass zhixingos-preview \
              -keypass zhixingos-preview \
              -alias zhixingos-preview \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=ZhixingOS CI Preview,O=ZhixingOS,C=CN"
            "$zipalign" -p -f 4 "$apk" /tmp/zhixingos-preview-aligned.apk
            "$apksigner" sign \
              --ks /tmp/zhixingos-preview.keystore \
              --ks-pass pass:zhixingos-preview \
              --key-pass pass:zhixingos-preview \
              --out /tmp/zhixingos-preview-signed.apk \
              /tmp/zhixingos-preview-aligned.apk
            apk=/tmp/zhixingos-preview-signed.apk
          fi

          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$($aapt dump badging "$apk" | head -n 8)"
          printf '%s\n' "$badging"
          printf '%s\n' "$badging" | grep -F "package: name='com.zhixingos.satori'"
          printf '%s\n' "$badging" | grep -F "versionCode='2'"
          printf '%s\n' "$badging" | grep -F "versionName='1.0.1'"

          version="$(node -p "require('./app.json').expo.version")"
          version_code="$(node -p "require('./app.json').expo.android.versionCode")"
          mkdir -p artifacts/android-preview
          out="artifacts/android-preview/ZhixingOS-${version}-local-preview.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee artifacts/android-preview/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "package=com.zhixingos.satori"
            echo "version=${version}"
            echo "versionCode=${version_code}"
            echo "variant=local-only-release-preview"
            echo "personalDataRuntime=device-local"
            echo "externalNetworkBoundary=explicit-https-llm-api-only"
            echo "automaticNativePhotoFitting=disabled"
            echo "forbiddenNativeVisionDependencies=none"
            echo "androidAllowBackup=false"
            echo "androidCleartextTraffic=false"
            echo "productionSigning=false"
            echo "physicalDeviceValidated=false"
          } > artifacts/android-preview/build-metadata.txt
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: zhixingos-android-local-preview-apk
          path: artifacts/android-preview/
          if-no-files-found: error
          retention-days: 14
