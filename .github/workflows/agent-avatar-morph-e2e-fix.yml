name: Temporary avatar morph E2E pointer fix

on:
  push:
    branches:
      - ai/avatar-model-morph-bridge-v1
    paths:
      - ".github/workflows/agent-avatar-morph-e2e-fix.yml"
      - "scripts/fix-avatar-morph-e2e-pointer.py"

permissions:
  contents: write

concurrency:
  group: temporary-avatar-morph-e2e-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ai/avatar-model-morph-bridge-v1
          fetch-depth: 0

      - name: Apply strict pointer fix
        run: python scripts/fix-avatar-morph-e2e-pointer.py

      - name: Commit E2E fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/avatar-research-candidate.spec.ts
          git diff --cached --check
          git commit -m "test: drive research morph sliders with real pointer input"
          git push origin HEAD:ai/avatar-model-morph-bridge-v1
