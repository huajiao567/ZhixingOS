name: Android native smoke

on:
  push:
    branches:
      - master
      - ai/android-native-smoke-v1
    paths:
      - ".github/workflows/android-native-smoke.yml"
      - "scripts/android-native-smoke.py"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "index.ts"
      - "App.tsx"
      - "assets/**"
      - "public/avatar/**"
      - "src/**"
      - "modules/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/android-native-smoke.yml"
      - "scripts/android-native-smoke.py"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "index.ts"
      - "App.tsx"
      - "assets/**"
      - "public/avatar/**"
      - "src/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhixingos-android-native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-smoke:
    name: Android emulator 390x844 native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE: http://10.0.2.2:3001
      AVD_NAME: zhixingos-ci
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Ensure Android SDK, emulator and system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ] && [ -n "${ANDROID_HOME:-}" ]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
            exit 1
          fi
          echo "SDKMANAGER=$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "$SYSTEM_IMAGE"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"

      - name: Build release-preview APK for emulator
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare reachable backend
        shell: bash
        run: |
          set -euo pipefail
          cp backend/.env.example backend/.env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=android-native-smoke-0123456789abcdef0123456789abcdef/' backend/.env
          npm --prefix backend run build
          npm --prefix backend run start > /tmp/zhixingos-backend-native.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhixingos-backend-native.log || true
          exit 1

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "/dev/kvm is unavailable; hosted-runner native emulator acceptance cannot run." >&2
            exit 1
          fi
          echo "no" | avdmanager create avd --force --name "$AVD_NAME" --package "$SYSTEM_IMAGE" --device "pixel_6"
          emulator "@$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -accel auto \
            > /tmp/zhixingos-emulator.log 2>&1 &
          adb wait-for-device
          for i in {1..120}; do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 390x844
          adb shell wm density 420
          adb shell input keyevent 82 || true
          adb shell wm size
          adb shell wm density

      - name: Install and exercise native app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-native
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$apk"
          adb install -r "$apk"
          adb shell am force-stop com.zhixingos.satori
          adb shell monkey -p com.zhixingos.satori -c android.intent.category.LAUNCHER 1

          python3 scripts/android-native-smoke.py wait "知行镜" --timeout 60
          adb exec-out screencap -p > artifacts/android-native/01-auth-native.png
          cp artifacts/android-native/window.xml artifacts/android-native/01-auth-window.xml

          python3 scripts/android-native-smoke.py tap "使用演示账号体验" --timeout 30
          python3 scripts/android-native-smoke.py tap "登录账号" --timeout 30
          python3 scripts/android-native-smoke.py wait "现在的我" --timeout 90

          # Give the bundled ~15 MB production VRM time to mount and settle.
          sleep 20
          python3 scripts/android-native-smoke.py assert-absent "原生 3D 数字人加载失败"
          python3 scripts/android-native-smoke.py dump
          adb exec-out screencap -p > artifacts/android-native/02-mirror-home-native.png
          cp artifacts/android-native/window.xml artifacts/android-native/02-mirror-home-window.xml
          adb logcat -d -v threadtime > artifacts/android-native/logcat.txt
          adb shell dumpsys gfxinfo com.zhixingos.satori > artifacts/android-native/gfxinfo.txt || true

          test -s artifacts/android-native/01-auth-native.png
          test -s artifacts/android-native/02-mirror-home-native.png
          if grep -F "[Avatar/Native] 3D render failed" artifacts/android-native/logcat.txt; then
            echo "Native Avatar V2 emitted a fatal 3D renderer error." >&2
            exit 1
          fi
          if grep -F "FATAL EXCEPTION" artifacts/android-native/logcat.txt; then
            echo "Android process emitted a FATAL EXCEPTION." >&2
            exit 1
          fi
          {
            echo "commit=${GITHUB_SHA}"
            echo "viewport=390x844"
            echo "package=com.zhixingos.satori"
            echo "backend=http://10.0.2.2:3001"
            echo "emulator=true"
            echo "physicalDeviceValidated=false"
            echo "productionSigning=false"
          } > artifacts/android-native/metadata.txt

      - name: Upload Android native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-smoke-evidence
          path: |
            artifacts/android-native/
            /tmp/zhixingos-emulator.log
            /tmp/zhixingos-backend-native.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== emulator ====="
          tail -n 300 /tmp/zhixingos-emulator.log || true
          echo "===== backend ====="
          tail -n 300 /tmp/zhixingos-backend-native.log || true
          echo "===== adb devices ====="
          adb devices -l || true
          echo "===== logcat tail ====="
          adb logcat -d -v threadtime | tail -n 500 || true
